plugins {
     id 'com.android.application'
}

android {
    namespace = "org.winfish.insaniquarium"
    compileSdkVersion 35
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "org.winfish.insaniquarium"
        // API 24 (Android 7.0, 2016) es el minimo real: curl activa
        // _FILE_OFFSET_BITS=64, y en 32 bits fseeko/ftello recien existen
        // desde la 24. Con minSdk 21 armeabi-v7a no compila.
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // c++_shared: PopLib y sus dependencias usan excepciones y RTTI,
                // y con varias unidades de traduccion grandes conviene una sola
                // copia de la STL.
                arguments "-DANDROID_PLATFORM=android-24",
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release",
                          // Explicito: option() no pisa un valor ya cacheado,
                          // asi que sin esto quedaria en el OFF que se cacheo
                          // cuando todavia no existian los .so de Android.
                          "-DPOPLIB_WITH_BASS=ON",
                          // Android 15+ puede usar paginas de 16 KB. Las libs
                          // alineadas a 4 KB disparan el aviso
                          // "PageSizeMismatchDialog" y en algunos dispositivos
                          // directamente no cargan. El NDK 27 lo soporta pero
                          // no lo activa por defecto (el 28 si).
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // arm64 cubre cualquier telefono moderno; armeabi-v7a suma los
                // de 32 bits, que Play sigue requiriendo para publicar.
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        // El abiFilters de cmake solo filtra lo que se COMPILA. Los .so que
        // vienen por jniLibs (libbass) se empaquetan todos si no se filtran
        // tambien aca: sin esto el APK cargaba las 4 arquitecturas de BASS.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    sourceSets.main {
        // Se apunta directo a la carpeta de PopLib en vez de copiar el .so,
        // para que no se desincronicen. Gradle toma las subcarpetas por ABI
        // (arm64-v8a/, armeabi-v7a/, ...) y empaqueta la que corresponda.
        jniLibs.srcDirs = ['libs', '../../../poplib/external/bass/android']
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            // El SDK trae 3.22.1 y 4.1.2; PopLib pide 3.26 como minimo.
            version '4.1.2'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
